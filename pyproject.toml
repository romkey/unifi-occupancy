[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-occupancy"
version = "0.4.0"
description = "Publish UniFi Protect detection state to MQTT without exposing camera video"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "John Romkey" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "websockets>=12.0",
    "aiomqtt>=2.0,<3.0",
    "PyYAML>=6.0",
    # zoneinfo has no database of its own on slim images or on Windows.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
unifi-occupancy = "unifi_occupancy.__main__:main"

[project.urls]
Homepage = "https://github.com/romkey/unifi-occupancy"
Source = "https://github.com/romkey/unifi-occupancy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["unifi_occupancy"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiomqtt.*", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["unifi_occupancy"]
branch = true
