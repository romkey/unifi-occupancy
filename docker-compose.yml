# Production: run the published/locally built runtime image.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d

services:
  unifi-occupancy:
    build:
      context: .
      target: runtime
    image: unifi-occupancy:latest
    container_name: unifi-occupancy
    restart: unless-stopped
    env_file: .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
