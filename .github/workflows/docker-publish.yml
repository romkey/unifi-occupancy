name: Docker publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Creating a release also creates its tag, so `gh release create` fires both
# `release: published` and `push: tags` seconds apart. Both keys have to resolve
# to the same group or the two runs do not see each other, race to push the same
# four tags, and can leave `latest` on a different digest from the version tag --
# which is exactly what happened to v0.2.0. `github.ref` is the tag's full ref on
# a push and its short name nowhere, so it cannot be the key; `ref_name` is the
# short name on both.
concurrency:
  group: docker-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Publishing release tag: $tag"
          else
            echo "No semver tag; image will be tagged by commit SHA only."
          fi

      # arm64 is built under emulation on the amd64 runner. Every dependency
      # ships an aarch64 wheel, so nothing compiles and the extra platform costs
      # minutes, not an hour.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.version.outputs.tag != '' }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
