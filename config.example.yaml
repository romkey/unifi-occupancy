# ---------------------------------------------------------------------------
# unifi-occupancy: camera groups, daily occupancy sheets, custom triggers
#
# Copy to ./config/config.yaml (mounted at /config/config.yaml in the
# container) and edit. Protect and MQTT are configured in .env, not here.
#
# This file existing is what switches the sheets on. Without it the service
# behaves exactly as it always has: MQTT only, nothing written to disk.
# ---------------------------------------------------------------------------

# IANA zone name. Days, midnights and the periods below are all local to it.
# Defaults to $TZ, or UTC.
timezone: America/Los_Angeles

reports:
  # Set false to keep the config file but stop writing sheets.
  enabled: true

  # Where the HTML goes. index.html and one YYYY-MM-DD.html per day.
  output_dir: /var/www/html

  # The detection history. Must be on a writable volume.
  database: /var/lib/unifi-occupancy/occupancy.sqlite3

  # Heading on every page.
  title: Occupancy

  # How often the current day's sheet is rewritten. 60 means on the hour; the
  # last write of a day always lands on local midnight, which is what starts
  # the next day's sheet.
  refresh_minutes: 60

  # Width of one bucket on the density strip. 10 gives 144 buckets a day.
  bucket_minutes: 10

  # Days of detection history to keep. 0 keeps everything -- a busy household
  # is on the order of a megabyte a month. Pruning never removes a sheet or
  # its counts, only the per-event detail behind them.
  retention_days: 0

# Times of day, shaded as bands behind every timeline. Any number of them,
# with any names; each runs until the next one starts, and the last wraps
# around midnight. Quote the times.
periods:
  - name: Night
    start: "00:00"
  - name: Morning
    start: "06:00"
  - name: Afternoon
    start: "12:00"
  - name: Evening
    start: "18:00"

# Cameras that cover one area, reported together. Name them as they are named
# in Protect; a slug (front_door) or a Protect id works too. Any camera not
# listed here gets a section of its own. Delete this whole block to treat
# every camera separately.
groups:
  - name: Front of house
    cameras:
      - Front Door
      - Driveway
      - Porch

  - name: Back yard
    cameras:
      - Back Yard
      - Garage

# ---------------------------------------------------------------------------
# Custom triggers: things to watch the cameras for that Protect cannot report.
#
# Each trigger is a name and a question. Every interval_minutes the service
# takes ONE snapshot of each camera the trigger names, asks a vision model the
# question, and publishes the answer on
#
#   unifi-occupancy/<camera>/trigger/<name>             ON | OFF
#   unifi-occupancy/<camera>/trigger/<name>/attributes  the explanation, etc.
#
# ON means the model could see what you described; OFF means it looked and
# could not. An unanswerable check (no snapshot, endpoint down, unreadable
# reply) publishes "unknown" to the attributes and leaves the boolean alone --
# it never reports all-clear for a check it could not make.
#
# This is one of the two features that reads a picture: with a trigger written
# here, snapshots leave the process for the endpoint below. They are held in
# memory for one request and are never logged or written to disk. They are not
# published either, unless a trigger sets publish_snapshot (see Fire below).
# Delete this whole block and no snapshot is ever taken.
#
# The endpoint, key and model default to the camera health check's
# (CAMERA_HEALTH_* in .env), or to VISION_* if you set those; the keys below
# override them for one trigger. The health check does not have to be on.
# ---------------------------------------------------------------------------
# triggers:
#   - name: Fire
#     # Say what counts and what does not: a vague prompt is a false alarm at
#     # 3am. Ask about what is visible in the frame, nothing else.
#     prompt: >
#       Is there an active fire in this frame -- open flames, burning material,
#       or thick smoke rising from something burning? Do not answer yes for
#       lights, reflections, sunsets, headlights, a lit cigarette or a barbecue
#       that is not out of control.
#     # A list of camera names, slugs or Protect ids -- or ALL for every camera.
#     cameras: ALL
#     # How often each of those cameras is checked. Default 15.
#     interval_minutes: 5
#     # Home Assistant device class for the binary sensor: problem, smoke,
#     # safety, door, ... Leave it out for a classless sensor.
#     device_class: problem
#     # Publish the frame that matched to trigger/fire/snapshot, so a
#     # notification can carry the picture of the fire rather than the word
#     # "ON". Off by default, and on purpose there is no way to switch it on
#     # for every trigger at once: a frame of a doorway probably shows a face,
#     # and everyone who can read your broker can read it. Published
#     # unretained, so it does not sit there after the match, and only ever on
#     # a match -- never on a clear or an unanswerable check.
#     publish_snapshot: true
#     # Triggers that agree on interval, endpoint, model and snapshot quality
#     # are asked together about one frame -- one request rather than one each.
#     # On by default; this turns it off for a prompt you would rather the
#     # model considered on its own.
#     batch: true
#     # Put this trigger's answers on the daily sheets: a lane on the
#     # timeline of every camera it watches, where a match opens the bar and
#     # the clear closes it. On by default wherever the sheets are on. Only
#     # the trigger, the camera and the two times are written -- never the
#     # sentence the model wrote. Set it false for a question whose answers
#     # should not outlive the moment they were given.
#     record: true
#
#   - name: Gate left open
#     prompt: Is the driveway gate standing open?
#     cameras:
#       - Driveway
#     interval_minutes: 30
#     # A model just for this trigger, on a server just for this trigger.
#     model: qwen2.5vl:7b
#     api_base_url: http://ollama.local:11434/v1
#     device_class: door
#
#   - name: Parcel on the step
#     prompt: Is there a parcel, box or padded envelope on the doorstep?
#     cameras:
#       - Front Door
#     interval_minutes: 15
#     # Keeps the trigger written down without running it. This is also how to
#     # switch one off properly: it retracts the entity and empties the topics,
#     # which deleting the block cannot do.
#     enabled: false
